name: Update Strava Stats

on:
  workflow_dispatch:
    inputs:
      total_km:
        description: 'All-time total running distance (km)'
        required: true
        type: string

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update running stats
        env:
          TOTAL_KM: ${{ inputs.total_km }}
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from datetime import datetime, timezone, timedelta

          total_km     = round(float(os.environ["TOTAL_KM"]), 1)
          print(f"Total km: {total_km}")

          # ── Patch index.html ─────────────────────────────────────────
          with open("index.html", "r") as f:
              html = f.read()

          # Total km → data-target attribute
          html = re.sub(
              r'(<span class="running-km-number"[^>]*data-target=")[^"]*(")',
              rf'\g<1>{total_km}\2',
              html
          )

          with open("index.html", "w") as f:
              f.write(html)

          print("index.html updated.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update running stats"
          git push
